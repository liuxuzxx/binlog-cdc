source:
  type: mysql
  hostname: 127.0.0.1
  port: 3306
  username: example_user
  password: example_password
  tables: 'app_db.orders,app_db.order_result'
  server-time-zone: Asia/Shanghai
  server-id: 5710-5716
  scan.startup.mode: specific-offset
  scan.startup.specific-offset.file: mysql-bin.000001
  scan.startup.specific-offset.pos: 4
sink:
  type: file
  name: file-sink
  path: /tmp/flink-cdc-init-output.ndjson
  append: false
pipeline:
  name: verify mysql snapshot to file
  parallelism: 2
verify:
  row-count: true
  fail-on-mismatch: true
