source:
  type: mysql
  name: mysql-source
  hostname: 127.0.0.1
  port: 3306
  username: example_user
  password: example_password
  tables: 'app_db.orders_[0-9]+'
  server-time-zone: Asia/Shanghai
  server-id: 5710-5716
  scan.startup.mode: specific-offset
  scan.startup.specific-offset.file: mysql-bin.000001
  scan.startup.specific-offset.pos: 4
sink:
  type: kafka
  name: Kafka-sink
  properties.bootstrap.servers: 127.0.0.1:9092
  properties.compression.type: lz4
  properties.max.request.size: 41943040
  properties.max.message.bytes: 41943040
  topic: cdc-events
transform:
  - source-table: app_db.orders_[0-9]+
    projection: "*,LOCALTIMESTAMP as cdc_processed_at"
pipeline:
  name: sync mysql to kafka
  parallelism: 2
  channel.capacity: 10
